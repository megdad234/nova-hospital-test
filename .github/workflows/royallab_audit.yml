name: RoyalLab NOVA read-only source audit
on:
  push:
    branches: [feature/royallab-full-migration-20261111]
    paths:
      - '.github/ci/royallab_source_audit.py'
      - 'hospital/royallab_staging.py'
      - 'tests/test_royallab_staging.py'
      - 'hospital/royallab_field_adapter.py'
      - 'tests/test_royallab_field_adapter.py'
      - '.github/ci/royallab_import_offline.py'
      - 'tests/test_royallab_import_offline.py'
      - 'hospital/royallab_catalog_preview.py'
      - 'tests/test_royallab_catalog_preview.py'
      - 'hospital/royallab_result_preview.py'
      - 'tests/test_royallab_result_preview.py'
      - 'hospital/royallab_form_preview_html.py'
      - 'tests/test_royallab_form_preview_html.py'
      - '.github/ci/royallab_nova_integration_audit.py'
      - 'hospital/royallab_integration_preflight.py'
      - 'tests/test_royallab_integration_preflight.py'
      - '.github/ci/royallab_lab_code_excerpts.py'
      - 'hospital/royallab_nova_save_bridge.py'
      - 'tests/test_royallab_nova_save_bridge.py'
      - '.github/ci/royallab_save_contract_audit.py'
      - '.github/ci/royallab_save_fixture_audit.py'
      - 'tests/test_royallab_actual_nova_save.py'
      - 'hospital/royallab_nova_parameter_activation.py'
      - 'tests/test_royallab_nova_parameter_activation.py'
      - 'tests/test_royallab_parameter_lifecycle.py'
      - 'hospital/royallab_nova_parameter_install.py'
      - 'tests/test_royallab_nova_parameter_install.py'
      - 'hospital/royallab_nova_parameter_plan.py'
      - 'tests/test_royallab_nova_parameter_plan.py'
      - '.github/ci/royallab_order_route_patch.py'
      - 'tests/test_royallab_order_route_patch.py'
      - 'tests/test_royallab_runtime_imports.py'
      - 'tests/test_royallab_gateway_build_smoke.py'
      - '.github/ci/royallab_windows_packaging_audit.py'
      - '.github/ci/royallab_order_route_audit.py'
      - '.github/ci/royallab_typed_input_patch.py'
      - 'tests/test_royallab_typed_input_patch.py'
      - 'tests/test_royallab_combined_ui_patches.py'
      - 'hospital/royallab_nova_binding_schema.py'
      - 'hospital/royallab_nova_live_order_overlay.py'
      - 'tests/test_royallab_nova_live_order_overlay.py'
      - 'tests/test_royallab_clinical_binding_integration.py'
      - 'hospital/royallab_nova_binding_loader.py'
      - 'tests/test_royallab_nova_binding_loader.py'
      - 'hospital/royallab_nova_order_detail_gate.py'
      - 'tests/test_royallab_nova_order_detail_gate.py'
      - 'hospital/royallab_nova_order_detail_types.py'
      - 'tests/test_royallab_nova_order_detail_types.py'
      - 'hospital/royallab_nova_typed_form_contract.py'
      - 'tests/test_royallab_nova_typed_form_contract.py'
      - 'hospital/royallab_nova_resolved_draft.py'
      - 'tests/test_royallab_nova_resolved_draft.py'
      - 'hospital/royallab_nova_order_line_resolver.py'
      - 'tests/test_royallab_nova_order_line_resolver.py'
      - 'hospital/royallab_nova_line_mapping.py'
      - 'tests/test_royallab_nova_line_mapping.py'
      - 'hospital/royallab_nova_draft_service.py'
      - 'tests/test_royallab_nova_draft_service.py'
      - 'hospital/royallab_lab_a4_preview.py'
      - 'tests/test_royallab_lab_a4_preview.py'
      - '.github/ci/royallab_report_contract_audit.py'
      - '.github/ci/royallab_print_route_scan.py'
      - '.github/ci/royallab_print_js_excerpt.py'
      - '.github/ci/royallab_lab_print_patch.py'
      - 'tests/test_royallab_lab_print_patch.py'
      - '.github/ci/royallab_print_integration_smoke.py'
      - '.github/ci/royallab_actual_line_schema_audit.py'
      - '.github/ci/royallab_print_css_audit.py'
      - '.github/ci/royallab_lab_a4_css_patch.py'
      - 'tests/test_royallab_lab_a4_css_patch.py'
      - '.github/workflows/royallab_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit original laboratory source without editing it
        run: python .github/ci/royallab_source_audit.py
      - name: Map original NOVA lab save and print integration points
        run: python .github/ci/royallab_nova_integration_audit.py
      - name: Inspect original NOVA lab integration code excerpts
        run: python .github/ci/royallab_lab_code_excerpts.py
      - name: Verify original NOVA save contract compatibility
        run: python .github/ci/royallab_save_contract_audit.py
      - name: Inspect original lab save prerequisites for real SQLite integration test
        run: python .github/ci/royallab_save_fixture_audit.py
      - name: Inspect original NOVA report data and print routes
        run: python .github/ci/royallab_report_contract_audit.py
      - name: Locate existing laboratory print routes and partial report text
        run: python .github/ci/royallab_print_route_scan.py
      - name: Inspect exact original lab JavaScript print implementation
        run: python .github/ci/royallab_print_js_excerpt.py
      - name: Validate extracted original lab print patch and unchanged pharmacy JS
        run: python .github/ci/royallab_print_integration_smoke.py
      - name: Audit actual NOVA lab result schema and section names
        run: python .github/ci/royallab_actual_line_schema_audit.py
      - name: Audit original Windows packaging for Royal Lab runtime modules
        run: python .github/ci/royallab_windows_packaging_audit.py
      - name: Inspect exact NOVA order detail route for reviewed Royal Lab overlay
        run: python .github/ci/royallab_order_route_audit.py
      - name: Audit actual lab print A4 styles and existing patches
        run: python .github/ci/royallab_print_css_audit.py
      - name: Verify isolated staging invariants
        run: python -m unittest discover -s tests -p 'test_royallab_*.py' -v
