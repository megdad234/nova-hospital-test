  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing ROYAL-240 GTT clinical form and historical results
        run: python -m unittest discover -s tests -p 'test_nova_gtt_royal240_fix.py' -v
      - name: Audit original laboratory source without editing it
        run: python .github/ci/royallab_source_audit.py
      - name: Map original NOVA lab save and print integration points
        run: python .github/ci/royallab_nova_integration_audit.py
      - name: Inspect original NOVA lab integration code excerpts
        run: python .github/ci/royallab_lab_code_excerpts.py
      - name: Verify original NOVA save contract compatibility
        run: python .github/ci/royallab_save_contract_audit.py
      - name: Inspect original lab save prerequisites for real SQLite integration test
        run: python .github/ci/royallab_save_fixture_audit.py
      - name: Inspect original NOVA report data and print routes
        run: python .github/ci/royallab_report_contract_audit.py
      - name: Locate existing laboratory print routes and partial report text
        run: python .github/ci/royallab_print_route_scan.py
      - name: Inspect exact original lab JavaScript print implementation
        run: python .github/ci/royallab_print_js_excerpt.py
      - name: Validate extracted original lab print patch and unchanged pharmacy JS
        run: python .github/ci/royallab_print_integration_smoke.py
      - name: Audit actual NOVA lab result schema and section names
        run: python .github/ci/royallab_actual_line_schema_audit.py
      - name: Audit original Windows packaging for Royal Lab runtime modules
        run: python .github/ci/royallab_windows_packaging_audit.py
      - name: Inspect exact NOVA order detail route for reviewed Royal Lab overlay
        run: python .github/ci/royallab_order_route_audit.py
      - name: Audit actual lab print A4 styles and existing patches
        run: python .github/ci/royallab_print_css_audit.py
      - name: Audit bundled original laboratory forms and review flags
        run: python -m hospital.royallab_catalog_audit > /tmp/nova_lab_catalog_audit.json && python -c "import json; r=json.load(open('/tmp/nova_lab_catalog_audit.json')); print({k:v for k,v in r.items() if k in ('test_count','source_analyte_count','source_result_field_count','detached_analyte_count','tests_requiring_review','runtime_ready_test_count','runtime_blocked_test_count','inactive_fields_excluded_from_entry','blank_source_placeholders_excluded_from_entry','excluded_empty_source_separators','excluded_unnamed_untyped_placeholders','review_flags','active_review_flags')})"
      - name: Show exact outstanding laboratory test reasons
        run: python -c "import json; r=json.load(open('/tmp/nova_lab_catalog_audit.json')); print(json.dumps(r['runtime_blocked_tests'],ensure_ascii=False))"
      - name: Diagnose unresolved active dropdown option labels
        run: python -c "import json; r=json.load(open('/tmp/nova_lab_catalog_audit.json')); print(json.dumps([{'source_test_id':x['source_test_id'],'fields':[f for f in x['fields'] if f['blank_options']]} for x in r['unresolved_field_evidence'] if any(f['blank_options'] for f in x['fields'])],ensure_ascii=False))"
      - name: Inspect original CBC field type evidence
        run: python -c "import json; r=json.load(open('/tmp/nova_lab_catalog_audit.json')); a=next(x for x in r['priority_test_forms'] if 'complete blood count' in x['name'].casefold()); print(json.dumps(a,ensure_ascii=False))"
      - name: Inspect source format gaps in historical RBS FBS culture and malaria templates
        run: python -c "import json; r=json.load(open('/tmp/nova_lab_catalog_audit.json')); ids={'273','274','284','14','60','29','263'}; print(json.dumps([x for x in r['unresolved_field_evidence'] if x['source_test_id'] in ids],ensure_ascii=False))"
      - name: Upload exact source catalog audit for remediation
        uses: actions/upload-artifact@v4
        with:
          name: nova-laboratory-catalog-audit
          path: /tmp/nova_lab_catalog_audit.json
          retention-days: 14
      - name: Verify in-app laboratory review JavaScript syntax
        run: node --check hospital/static/royallab-native-picker.js
      - name: Verify NOVA local lab tests creation and edit safety
        run: python -m unittest discover -s tests -p 'test_nova_lab_local_tests.py' -v
      - name: Verify photographed GTT urine glucose form and GET/POST clinical approval
        run: python -m unittest discover -s tests -p 'test_nova_lab_gtt_with_urine.py' -v
      - name: Verify isolated staging invariants
        run: python -m unittest discover -s tests -p 'test_royallab_*.py' -v
