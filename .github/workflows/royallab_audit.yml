name: RoyalLab NOVA read-only source audit
on:
  push:
    branches: [feature/royallab-full-migration-20261111]
    paths:
      - '.github/ci/royallab_source_audit.py'
      - 'hospital/royallab_staging.py'
      - 'tests/test_royallab_staging.py'
      - 'hospital/royallab_field_adapter.py'
      - 'tests/test_royallab_field_adapter.py'
      - '.github/ci/royallab_import_offline.py'
      - 'tests/test_royallab_import_offline.py'
      - 'hospital/royallab_catalog_preview.py'
      - 'tests/test_royallab_catalog_preview.py'
      - 'hospital/royallab_result_preview.py'
      - 'tests/test_royallab_result_preview.py'
      - 'hospital/royallab_form_preview_html.py'
      - 'tests/test_royallab_form_preview_html.py'
      - '.github/ci/royallab_nova_integration_audit.py'
      - 'hospital/royallab_integration_preflight.py'
      - 'tests/test_royallab_integration_preflight.py'
      - '.github/ci/royallab_lab_code_excerpts.py'
      - 'hospital/royallab_nova_save_bridge.py'
      - 'tests/test_royallab_nova_save_bridge.py'
      - '.github/ci/royallab_save_contract_audit.py'
      - '.github/ci/royallab_save_fixture_audit.py'
      - 'tests/test_royallab_actual_nova_save.py'
      - 'hospital/royallab_nova_line_mapping.py'
      - 'tests/test_royallab_nova_line_mapping.py'
      - '.github/workflows/royallab_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit original laboratory source without editing it
        run: python .github/ci/royallab_source_audit.py
      - name: Map original NOVA lab save and print integration points
        run: python .github/ci/royallab_nova_integration_audit.py
      - name: Inspect original NOVA lab integration code excerpts
        run: python .github/ci/royallab_lab_code_excerpts.py
      - name: Verify original NOVA save contract compatibility
        run: python .github/ci/royallab_save_contract_audit.py
      - name: Inspect original lab save prerequisites for real SQLite integration test
        run: python .github/ci/royallab_save_fixture_audit.py
      - name: Verify isolated staging invariants
        run: python -m unittest discover -s tests -p 'test_royallab_*.py' -v
