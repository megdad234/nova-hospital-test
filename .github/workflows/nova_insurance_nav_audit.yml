name: Read-only NOVA insurance configuration navigation audit
on:
  push:
    branches: [audit/nova-insurance-navigation-20261119]
    paths: ['.github/workflows/nova_insurance_nav_audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Read original finance and insurance management routes
      shell: bash
      run: |
        python - <<'PY'
        import zipfile,re,ast
        with zipfile.ZipFile("NOVA_Hospital_GitHub_Ready_Source.zip") as z:
          for fname in ("hospital/finance.py","hospital/gateway.py","hospital/static/app.js","pharmacy/app.py","pharmacy/static/app.js"):
            if fname not in z.namelist():continue
            lines=z.read(fname).decode("utf-8-sig").splitlines()
            print("======",fname,len(lines),"lines======")
            look=re.compile(r"insur|insurer|insurance|شركة تأمين|شركة التأمين|جهة التأمين|إضافة.*شركة|insurance_contract|partners\b|claims|التأمين والمطالبات|إعدادات الخدمات|إعدادات التأمين",re.I)
            hits=[i for i,l in enumerate(lines) if look.search(l)]
            if fname.endswith("app.js"):
              for i in hits[:100]:
                print(f"{i+1}: {lines[i][:650]}")
            else:
              for i in hits[:115]:
                print(f"{i+1}: {lines[i][:750]}")
        print("====== INSURER SETTINGS FRONTEND ======")
        with zipfile.ZipFile("NOVA_Hospital_GitHub_Ready_Source.zip") as z:
          files=[n for n in z.namelist() if n.startswith("hospital/") and (n.endswith('.js') or n.endswith('.html'))]
          print("ALL WEB FILES",files)
          for fname in files:
            content=z.read(fname).decode('utf-8-sig')
            patterns=['financeSettingsView','wireFinanceSettings','upsert-insurer','insurer-form','insurer-name','شركة تأمين جديدة','إضافة شركة تأمين','insurer_id','insurers']
            hits=[(term,content.find(term)) for term in patterns if term in content]
            if not hits:continue
            print('FILE',fname,'HITS',hits)
            ls=content.splitlines()
            for i,line in enumerate(ls):
              if re.search(r'financeSettingsView|wireFinanceSettings|upsert-insurer|insurer-form|insurer-name|إضافة شركة تأمين|حفظ شركة التأمين|شركة التأمين|insurerSave|insurerRates',line,re.I):
                print('LINES',i+1,line[:5000])
        print("======= CLAIM DETAIL / DATE RANGE CONTRACT =======")
        with zipfile.ZipFile("NOVA_Hospital_GitHub_Ready_Source.zip") as z:
          for fname in ("hospital/static/admin-ui.js","hospital/admin.py","hospital/gateway.py","pharmacy/app.py","pharmacy/static/app.js"):
            if fname not in z.namelist():continue
            content=z.read(fname).decode("utf-8-sig")
            print("#####",fname,"#####")
            if fname.endswith('admin-ui.js'):
              for kw in ("admClaimsTable","admCompanyPicker","admLoadClaims","admExportClaims","admCSV","admPrint","viewAdminPage","admin-insurance","admGetRange","dateFrom","adminState","admLoadReport"):
                pos=content.find(kw)
                if pos>=0:print("SECTION",kw,"\n",content[max(0,pos-240):min(len(content),pos+3400)])
            elif fname=="hospital/admin.py":
              for kw in ("def insurer_claims(","def reports(","def report(","def insurance_","def get_insurer_","def admin_report("):
                pos=content.find(kw)
                if pos>=0:print("SECTION",kw,"\n",content[pos:min(len(content),pos+6000)])
            elif fname=="hospital/gateway.py":
              for kw in ("path=='/api/hospital/admin/claims'","path=='/api/hospital/admin/report'"):
                pos=content.find(kw)
                if pos>=0:print("SECTION",kw,"\n",content[max(0,pos-300):pos+750])
            elif fname=="pharmacy/app.py":
              for kw in ("def claim_create(","def insurance_list("):
                pos=content.find(kw)
                if pos>=0:print("SECTION",kw,"\n",content[pos:pos+3600])
        print("===== END CLAIM DETAIL / DATE RANGE =====")
        print("===== END INSURANCE UI =====")
        print('===== MONTHLY CLAIM READONLY ROUTES =====')
        with zipfile.ZipFile("NOVA_Hospital_GitHub_Ready_Source.zip") as z:
          for name,patterns in (
            ("hospital/static/admin-ui.js",["function admCompanyPicker","function admClaimsTable","async function admLoadClaims","function admInsuranceForm","function viewAdminPage","function wireAdminPage"]),
            ("hospital/admin.py",["def insurer_claims","def settlements","def admin_report","def overview","def insurance"]),
            ("hospital/static/finance-ui.js",["function viewClaims","function wireClaims"]),
            ("pharmacy/app.py",["def claim_create","def insurance_list"]),
            ("pharmacy/static/app.js",["function claims","function newClaim","function saveClaim"])):
            if name not in z.namelist():continue
            text=z.read(name).decode('utf-8-sig')
            print('FILE',name)
            for pattern in patterns:
              p=text.find(pattern)
              if p>=0:print('FUNCTION',pattern,'OFFSET',p,'EXCERPT',text[p:p+4800][:4800])
        print('===== END MONTHLY CLAIM =====')
        PY