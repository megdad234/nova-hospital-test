name: Commercial Windows EXE Candidates
on:
  workflow_dispatch:
  push:
    branches: [commercial-pharmacy-extraction-2026-11-04]
    paths:
      - "commercial_pharmacy/**"
      - ".github/workflows/commercial_pharmacy_candidates.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller pywin32
      - shell: pwsh
        run: ./commercial_pharmacy/windows/build-commercial-executables.ps1 -SourceRoot .
      - name: Smoke test frozen pharmacy LAN client
        shell: pwsh
        run: |
          $url = & ./dist/commercial/NOVACommercialPharmacy.exe --print-url
          if ($LASTEXITCODE -ne 0 -or $url.Trim() -ne "http://127.0.0.1:18763/") { throw "Frozen commercial client smoke test failed" }
      - name: Validate both Windows candidate binaries
        shell: pwsh
        run: |
          & ./commercial_pharmacy/windows/validate-installer-inputs.ps1 -SourceRoot .
          if ($LASTEXITCODE -ne 0) { throw "Windows candidate input validation failed" }
      - name: Record candidate executable hashes
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/commercial -Filter *.exe
          if ($files.Count -ne 2) { throw "Expected two independent commercial executables" }
          $files | Get-FileHash -Algorithm SHA256 | Select-Object Path, Hash | ConvertTo-Json | Set-Content -Path dist/commercial/CANDIDATE_SHA256.json -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Commercial-EXE-CANDIDATES-NOT-INSTALLABLE
          path: dist/commercial/
          if-no-files-found: error
