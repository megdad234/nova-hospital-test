name: Commercial Pharmacy - Isolated Source and Runtime Tests
on:
  push:
    branches:
      - commercial-pharmacy-extraction-2026-11-04
    paths:
      - 'commercial_pharmacy/**'
      - '.github/ci/stage_commercial_pharmacy.py'
      - '.github/ci/audit_commercial_pharmacy.py'
      - '.github/ci/audit_commercial_pharmacy_assets.py'
      - '.github/ci/locate_commercial_integration_points.py'
      - '.github/ci/nova_batch16_return_status.py'
      - '.github/ci/nova_batch12_insurance.py'
      - '.github/ci/nova_batch15_bulk_prices.py'
      - '.github/ci/nova_bulk_prices_ui.js'
      - '.github/ci/nova_manual_price_editor.js'
      - '.github/ci/test_nova_manual_price.py'
      - '.github/ci/test_nova_bulk_price_integration.py'
      - 'pharmacy/static/nova_batch09_pos.js'
      - 'pharmacy/static/nova_batch09_pos.css'
      - 'pharmacy/static/nova_batch12_insurance.js'
      - 'pharmacy/static/nova_batch12_insurance.css'
      - '.github/ci/test_commercial_latest_sync.py'
      - '.github/ci/patch_commercial_insurance.py'
      - '.github/ci/patch_commercial_brand.py'
      - '.github/ci/patch_commercial_database.py'
      - '.github/ci/patch_commercial_server_host.py'
      - '.github/ci/audit_commercial_hospital_coupling.py'
      - '.github/ci/commercial_runtime_preflight.py'
      - '.github/ci/assemble_commercial_windows_payload.py'
      - '.github/ci/audit_commercial_server_entrypoint.py'
      - '.github/ci/audit_commercial_runtime_dependencies.py'
      - '.github/ci/test_audit_commercial_runtime_dependencies.py'
      - '.github/ci/test_audit_commercial_server_entrypoint.py'
      - '.github/ci/verify_commercial_snapshot.py'
      - '.github/ci/audit_commercial_windows_identity.py'
      - '.github/ci/commercial_pharmacy_identity.py'
      - '.github/ci/commercial_pharmacy_release_gate.py'
      - '.github/ci/test_*commercial_pharmacy*.py'
      - '.github/ci/test_commercial_*.py'
      - '.github/ci/test_patch_commercial_*.py'
      - '.github/ci/test_verify_commercial_snapshot.py'
      - '.github/workflows/commercial_pharmacy_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commercial-pharmacy-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse commercial Windows service scripts without executing them
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem 'commercial_pharmacy/windows' -Filter '*.ps1'
          foreach ($file in $files) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax invalid: $($file.Name)" }
          }
      - name: Validate syntax and isolation primitives
        shell: bash
        run: |
          python -m compileall -q commercial_pharmacy .github/ci
          python -m unittest -v commercial_pharmacy.test_runtime_isolation commercial_pharmacy.test_database commercial_pharmacy.test_backup commercial_pharmacy.test_restore commercial_pharmacy.test_insurance_registry commercial_pharmacy.test_cli commercial_pharmacy.test_windows_installer_contract commercial_pharmacy.test_windows_service_state commercial_pharmacy.test_service_upgrade_contract commercial_pharmacy.test_windows_service commercial_pharmacy.test_launch commercial_pharmacy.test_desktop_client commercial_pharmacy.test_service_launcher_integration commercial_pharmacy.test_windows_lan_shortcut commercial_pharmacy.test_smoke_http commercial_pharmacy.test_live_server_smoke commercial_pharmacy.test_windows_runtime_bundle commercial_pharmacy.test_windows_payload_assembly
      - name: Verify extraction and release-gate negative tests
        shell: bash
        run: |
          python .github/ci/test_stage_commercial_pharmacy.py
          python .github/ci/test_commercial_pharmacy_contract.py
          python .github/ci/test_commercial_pharmacy_release_gate.py
          python .github/ci/test_patch_commercial_insurance.py
          python .github/ci/test_commercial_insurance_real_schema.py
          if [ $? -ne 0 ]; then exit 1; fi
          python .github/ci/test_patch_commercial_brand.py
          python .github/ci/test_patch_commercial_database.py
          python .github/ci/test_assemble_commercial_windows_payload.py
          python .github/ci/test_audit_commercial_server_entrypoint.py
          python .github/ci/test_audit_commercial_runtime_dependencies.py
          python .github/ci/test_commercial_runtime_preflight.py
          python .github/ci/test_verify_commercial_snapshot.py
  snapshot:
    runs-on: windows-2025
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    needs: isolated-runtime
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract NOVA reference source without building hospital
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Expand-Archive -LiteralPath 'NOVA_Hospital_GitHub_Ready_Source.zip' -DestinationPath '.' -Force
          if (!(Test-Path 'pharmacy/app.py')) { throw 'NOVA pharmacy source missing' }
      - name: Apply NOVA source patches in canonical order
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python .github/ci/windows_sqlite_test_cleanup.py
          if ($LASTEXITCODE -ne 0) { throw 'SQLite source compatibility patch failed' }
          python .github/ci/patch_upgrade_hash.py
          if ($LASTEXITCODE -ne 0) { throw 'Updater integrity patch failed' }
          $patches = @(
            'nova_batch01_patch.py','nova_batch02_patch.py','nova_batch03_patch.py',
            'nova_batch04_lab_reception.py','nova_batch05_cashier_pharmacy.py',
            'nova_batch05_ui.py','nova_batch05_free_policy.py',
            'nova_batch05_test_expectations.py','nova_batch06_insurance.py',
            'nova_batch07_reference_ui.py','nova_batch08_pharmacy_recovery.py',
            'nova_batch09_pos_admin.py','nova_batch10_receipt_print.py',
            'nova_batch11_unified_print.py','nova_batch12_insurance.py',
            'nova_batch13_purchase.py','nova_batch14_pos_discount.py',
            'nova_batch14_finance_tests.py','nova_price_integration_audit.py'
          )
          foreach ($patch in $patches) {
            python ".github/ci/$patch"
            if ($LASTEXITCODE -ne 0) { throw "Failed to apply $patch" }
          }
          python .github/ci/nova_batch15_integration_audit.py
          if ($LASTEXITCODE -ne 0) { throw "NOVA Batch15 integration preflight failed" }
          python .github/ci/nova_batch15_bulk_prices.py
          if ($LASTEXITCODE -ne 0) { throw "NOVA Batch15 bulk prices failed" }
          # Main NOVA price-editor and supplier price regressions run on
          # generated pharmacy source and synthetic data only.
          python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4'
          if ($LASTEXITCODE -ne 0) { throw 'Excel test prerequisite install failed' }
          node --check pharmacy/static/nova_manual_price_editor.js
          if ($LASTEXITCODE -ne 0) { throw 'Individual price editor JavaScript invalid' }
          node --check pharmacy/static/nova_bulk_prices_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Supplier price editor JavaScript invalid' }
          python .github/ci/test_nova_manual_price.py
          if ($LASTEXITCODE -ne 0) { throw 'Individual price edit regression failed' }
          python .github/ci/test_nova_bulk_price_integration.py
          if ($LASTEXITCODE -ne 0) { throw 'Supplier price stock/expiry or rollback regression failed' }
      - name: Apply latest approved NOVA sale-return status without changing POS
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python .github/ci/nova_batch16_return_status.py
          if ($LASTEXITCODE -ne 0) { throw 'Latest sale-return status patch rejected; commercial extraction blocked' }
          node --check pharmacy/static/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Latest sale-return JavaScript invalid' }
      - name: Isolate pharmacy database globals from NOVA Hospital
        shell: pwsh
        run: |
          python .github/ci/patch_commercial_database.py
          if ($LASTEXITCODE -ne 0) { throw 'Commercial database isolation failed' }
      - name: Decouple pharmacy insurance from hospital patient records
        shell: pwsh
        run: |
          python .github/ci/patch_commercial_insurance.py
          if ($LASTEXITCODE -ne 0) { throw 'Commercial pharmacy insurance decoupling failed' }
          python -m compileall -q pharmacy
          if ($LASTEXITCODE -ne 0) { throw 'Commercial pharmacy syntax failed' }
      - name: Remove hospital branding dependency from pharmacy POS
        shell: pwsh
        run: |
          node --check pharmacy/static/app.js
          python .github/ci/patch_commercial_brand.py
          if ($LASTEXITCODE -ne 0) { throw 'Commercial branding decoupling failed' }
          node --check pharmacy/static/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Commercial POS JavaScript invalid' }
          node --check pharmacy/static/nova_pharmacy_batch08.js
          if ($LASTEXITCODE -ne 0) { throw 'Commercial insurance JavaScript invalid' }
      - name: Verify modern pharmacy returns, supplier price overlay and data isolation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python .github/ci/test_commercial_latest_sync.py
          if ($LASTEXITCODE -ne 0) { throw 'Modern pharmacy transfer regression failed' }
      - name: Isolate extracted server port and database identity
        shell: pwsh
        run: |
          python .github/ci/patch_commercial_server_host.py
          if ($LASTEXITCODE -ne 0) { throw 'Commercial server host isolation failed' }
      - name: Compare working NOVA Hospital Windows installer and service boot contract
        shell: pwsh
        run: |
          foreach ($path in @('windows/build-windows.ps1','windows/ci-acceptance.ps1')) {
            if (!(Test-Path $path)) { throw "Hospital installer reference missing: $path" }
            Write-Host "HOSPITAL_REFERENCE $path"
            Select-String -Path $path -Pattern 'service|sc.exe|Start-Service|Inno|iscc|setup|startup|python|127.0.0.1|wait|ready|port' -Context 2,2 | Select-Object -First 100 | ForEach-Object { Write-Host $_.ToString() }
          }
      - name: Inspect extracted server entrypoint for independent port wiring
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path('pharmacy/server_host.py'); print('EXTRACTED_SERVER_HOST_BEGIN'); print(p.read_text(encoding='utf-8')[:14000]); print('EXTRACTED_SERVER_HOST_END')"
      - name: Verify commercial pharmacy source launch environment
        shell: pwsh
        run: |
          python -m commercial_pharmacy.launch --source-root . --data-dir "$env:RUNNER_TEMP\NOVACommercialPharmacy" --preflight-only
          if ($LASTEXITCODE -ne 0) { throw "Commercial pharmacy source launcher preflight failed" }
      - name: Real server smoke on Windows
        shell: pwsh
        run: |
          python -m commercial_pharmacy.live_server_smoke --source-root . --data-dir "$env:RUNNER_TEMP/NOVACommercialSmoke" --output commercial_live_smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Commercial live server smoke failed' }
          $result = Get-Content commercial_live_smoke.json -Raw | ConvertFrom-Json
          if (!$result.database_verified) { throw 'Commercial database integrity check failed' }
      - name: Preserve live server result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Commercial-Windows-Live-Smoke-Result
          path: commercial_live_smoke.json
          if-no-files-found: warn
      - name: Create audited source snapshot
        shell: pwsh
        run: |
          python .github/ci/stage_commercial_pharmacy.py
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
          python .github/ci/verify_commercial_snapshot.py
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot source integrity failed' }
          python .github/ci/audit_commercial_pharmacy.py
          if ($LASTEXITCODE -ne 0) { throw 'Audit failed' }
          python .github/ci/audit_commercial_pharmacy_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Asset audit failed' }
          python .github/ci/audit_commercial_runtime_dependencies.py
          if ($LASTEXITCODE -ne 0) { throw "Pharmacy dependency inventory failed" }
          python .github/ci/audit_commercial_server_entrypoint.py
          if ($LASTEXITCODE -ne 0) { throw "Server entrypoint audit failed" }
          python .github/ci/locate_commercial_integration_points.py
          if ($LASTEXITCODE -ne 0) { throw 'Integration point discovery failed' }
          python .github/ci/audit_commercial_hospital_coupling.py
          if ($LASTEXITCODE -ne 0) { throw 'Hospital coupling audit failed' }
          python -c "from pathlib import Path; print(Path('commercial_pharmacy_stage/HOSPITAL_COUPLING_BLOCKERS.json').read_text(encoding='utf-8'))"
          python .github/ci/commercial_pharmacy_identity.py
          if ($LASTEXITCODE -ne 0) { throw 'Identity contract failed' }
          python .github/ci/audit_commercial_windows_identity.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows identity audit failed' }
          python .github/ci/commercial_runtime_preflight.py
          if ($LASTEXITCODE -ne 0) { Write-Host 'Standalone runtime preflight BLOCKED: see uploaded evidence' }
      - name: Upload source snapshot, NOT a commercial installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Commercial-Pharmacy-Audited-Source-NOT-INSTALLABLE
          path: commercial_pharmacy_stage/
          retention-days: 7
          if-no-files-found: error

  windows-launcher-build:
    runs-on: windows-2025
    needs: snapshot
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows launcher build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller pywin32
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher build dependencies unavailable' }
      - name: Build commercial-only Windows executables
        shell: pwsh
        run: |
          & ./commercial_pharmacy/windows/build-commercial-executables.ps1 -SourceRoot (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { throw 'Commercial Windows executable build failed' }
          & ./commercial_pharmacy/windows/validate-installer-inputs.ps1 -SourceRoot (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { throw 'Commercial Windows PE validation failed' }
      - name: Upload commercial launchers for packaging development, not installation
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Commercial-Windows-Launchers-NOT-INSTALLABLE
          path: |
            dist/commercial/NOVACommercialPharmacy.exe
            dist/commercial/NOVACommercialPharmacyServer.exe
          retention-days: 7
          if-no-files-found: error

  windows-standalone-payload:
    runs-on: windows-2025
    needs: [snapshot, windows-launcher-build]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Commercial-Pharmacy-Audited-Source-NOT-INSTALLABLE
          path: commercial_pharmacy_stage
      - uses: actions/download-artifact@v4
        with:
          name: NOVA-Commercial-Windows-Launchers-NOT-INSTALLABLE
          path: commercial_launchers
      - name: Create independent embedded Python runtime
        shell: pwsh
        run: |
          & ./commercial_pharmacy/windows/build-embedded-runtime.ps1 -Destination "$env:RUNNER_TEMP/NOVACommercialEmbeddedPython"
          if ($LASTEXITCODE -ne 0) { throw 'Independent Python runtime build failed' }
      - name: Assemble and launch-test standalone pharmacy payload
        shell: pwsh
        run: |
          & ./commercial_pharmacy/windows/assemble-standalone-payload.ps1 -SourceStage (Resolve-Path commercial_pharmacy_stage).Path -PythonRuntimeDirectory "$env:RUNNER_TEMP/NOVACommercialEmbeddedPython" -LaunchersDirectory (Resolve-Path commercial_launchers).Path -Destination (Join-Path (Get-Location).Path 'dist/commercial')
          if ($LASTEXITCODE -ne 0) { throw 'Standalone commercial pharmacy assembly failed' }
      - name: Bundle hospital-style NSSM service wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = (Resolve-Path 'dist/commercial').Path
          Push-Location $env:RUNNER_TEMP
          try {
            choco install nssm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSSM installation failed' }
          } finally { Pop-Location }
          $candidates = @(
            'C:/ProgramData/chocolatey/lib/nssm/tools/nssm.exe',
            'C:/ProgramData/chocolatey/lib/NSSM/tools/nssm.exe',
            'C:/ProgramData/chocolatey/bin/nssm.exe'
          )
          $binary = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (!$binary) { throw 'NSSM executable missing from Chocolatey package' }
          Copy-Item -LiteralPath $binary -Destination (Join-Path $payload 'nssm.exe')
          & (Join-Path $payload 'nssm.exe') version
      - name: Upload tested standalone payload candidate
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Commercial-Standalone-Payload-CANDIDATE
          path: dist/commercial/
          retention-days: 7
          if-no-files-found: error

  windows-installer-candidate:
    runs-on: windows-2025
    needs: windows-standalone-payload
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NOVA-Commercial-Standalone-Payload-CANDIDATE
          path: dist/commercial
      - name: Compile explicitly unverified Windows installer
        shell: pwsh
        env:
          NOVA_COMMERCIAL_ALLOW_UNVERIFIED_INSTALLER: 'YES'
        run: |
          $compiler = @(
            "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe",
            "$env:ProgramFiles\\Inno Setup 6\\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (!$compiler) { throw 'Inno Setup 6 compiler unavailable on runner' }
          & ./commercial_pharmacy/windows/build-installer-candidate.ps1 -SourceRoot (Get-Location).Path -InnoCompiler $compiler
          if ($LASTEXITCODE -ne 0) { throw 'Commercial installer candidate compilation failed' }
      - name: Upload unverified installer candidate for acceptance testing
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Commercial-Setup-UNVERIFIED-NOT-FOR-PRODUCTION
          path: dist/commercial-installer-candidate/*.exe
          retention-days: 7
          if-no-files-found: error

  windows-installer-installation-test:
    runs-on: windows-2025
    needs: windows-installer-candidate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NOVA-Commercial-Setup-UNVERIFIED-NOT-FOR-PRODUCTION
          path: installer-candidate
      - name: Silent install and verify isolated commercial files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem installer-candidate -Filter '*.exe' | Select-Object -First 1
          if (!$installer) { throw 'Candidate installer missing' }
          $target = Join-Path $env:RUNNER_TEMP 'NOVACommercialInstallAcceptance'
          $log = Join-Path $env:RUNNER_TEMP 'NOVACommercialInstall.log'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target","/LOG=$log") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          foreach ($item in @('NOVACommercialPharmacy.exe','NOVACommercialPharmacyServer.exe','runtime/python.exe','pharmacy/app.py','pharmacy/server_host.py','commercial_pharmacy/launch.py')) {
            if (!(Test-Path -LiteralPath (Join-Path $target $item) -PathType Leaf)) { throw "Installed file missing: $item" }
          }
          if (!(Test-Path (Join-Path $target 'nssm.exe'))) { throw 'Hospital-style NSSM manager missing from installed package' }
          if (Test-Path (Join-Path $target 'hospital_reference')) { throw 'Hospital reference shipped inside installer' }
          $service = Get-Service -Name NOVACommercialPharmacyServer -ErrorAction SilentlyContinue
          if (!$service -or $service.Status -ne 'Running') {
            Write-Host 'COMMERCIAL_INSTALLER_DIAGNOSTICS_BEGIN'
            if (Test-Path $log) { Get-Content $log -Tail 100 | ForEach-Object { Write-Host $_ } }
            Get-Service -Name NOVACommercialPharmacyServer -ErrorAction SilentlyContinue | Format-List * | Out-String | Write-Host
            if (Test-Path (Join-Path $target 'nssm.exe')) {
              & (Join-Path $target 'nssm.exe') dump NOVACommercialPharmacyServer 2>&1 | Out-String | Write-Host
            }
            throw 'Installer did not automatically start commercial pharmacy service'
          }
          $serviceConfig = Get-CimInstance Win32_Service -Filter "Name='NOVACommercialPharmacyServer'"
          if ($serviceConfig.PathName -notmatch 'nssm.exe') { throw 'Commercial service is not using NSSM' }
          $ready = $false
          for ($attempt=0; $attempt -lt 30; $attempt++) {
            try {
              $response = Invoke-WebRequest 'http://127.0.0.1:18763/' -TimeoutSec 3
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (!$ready) { throw 'Installed commercial service is not serving HTTP' }
          Write-Host 'AUTOMATIC_COMMERCIAL_SERVICE_AND_HTTP_PASSED'
          & (Join-Path $target 'runtime/python.exe') -m commercial_pharmacy.launch --source-root $target --preflight-only
          if ($LASTEXITCODE -ne 0) { throw 'Installed commercial pharmacy failed preflight' }
          # Upgrade-in-place acceptance: ensure persistent commercial data survives setup rerun.
          $dataRoot = Join-Path $env:ProgramData 'NOVACommercialPharmacy'
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $marker = Join-Path $dataRoot 'ci-upgrade-preservation-marker.txt'
          $sentinel = 'NOVA_COMMERCIAL_UPGRADE_PRESERVATION'
          [System.IO.File]::WriteAllText($marker, $sentinel)
          $upgrade = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target","/LOG=$log") -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Commercial upgrade failed: $($upgrade.ExitCode)" }
          if (!(Test-Path $marker) -or [System.IO.File]::ReadAllText($marker) -ne $sentinel) { throw 'Commercial data lost during upgrade' }
          $upgradedService = Get-Service NOVACommercialPharmacyServer -ErrorAction SilentlyContinue
          if (!$upgradedService -or $upgradedService.Status -ne 'Running') { throw 'Commercial service not running after upgrade' }
          $upgradeHttp = Invoke-WebRequest 'http://127.0.0.1:18763/' -TimeoutSec 12
          if ($upgradeHttp.StatusCode -ne 200) { throw 'Commercial HTTP failed after upgrade' }
          Write-Host 'COMMERCIAL_IN_PLACE_UPGRADE_PRESERVED_DATA_AND_HTTP'
          $uninstaller = Get-ChildItem $target -Filter 'unins*.exe' | Select-Object -First 1
          if (!$uninstaller) { throw 'Inno Setup uninstaller missing' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path (Join-Path $target 'pharmacy/app.py')) { throw 'Uninstall left commercial program source behind' }
          if (Get-Service NOVACommercialPharmacyServer -ErrorAction SilentlyContinue) { throw 'Uninstall left commercial service registered' }
          Write-Host 'COMMERCIAL_INSTALL_UNINSTALL_STRUCTURE_ACCEPTED_NO_POS_OR_SERVICE_ACCEPTANCE'
