name: NOVA Print Source Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nova_print_diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archived receipt functions and styles (read-only)
        shell: bash
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          z=ZipFile('NOVA_Hospital_GitHub_Ready_Source.zip')
          print('ZIP ROOT FILES', z.namelist()[:16])
          for suffix in ('pharmacy/static/app.js','pharmacy/static/style.css','hospital/static/finance-ui.js','hospital/static/style.css'):
              entries=[n for n in z.namelist() if n.endswith(suffix)]
              for n in entries[:1]:
                  lines=z.read(n).decode('utf-8-sig').splitlines()
                  keys=('thermal-receipt','function print','function printSale','@page','@media print','printing-','print-area','window.print','print()','paper')
                  hits=[i for i,l in enumerate(lines) if any(k.lower() in l.lower() for k in keys)]
                  print('===',n,'total lines',len(lines),'hits',len(hits),'===')
                  seen=set()
                  for i in hits[:60]:
                      for j in range(max(0,i-4),min(len(lines),i+6)):
                          if j not in seen:
                              print(f'{j+1}: {lines[j][:1200]}')
                              seen.add(j)
                      print('---')
          PY
