name: NOVA ICT result snapshot layout probe
on:
  push:
    branches: [feature/royallab-full-migration-20261111]
    paths: ['.github/workflows/nova_ict_snapshot_probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect NOVA original result-snapshot implementation
        run: |
          python - <<'PY'
          import ast,zipfile
          with zipfile.ZipFile("NOVA_Hospital_GitHub_Ready_Source.zip") as z:
              source=z.read("hospital/lab.py").decode("utf-8-sig")
          for node in ast.parse(source).body:
              if isinstance(node,ast.FunctionDef) and (node.name in
                  ("snapshot_item","ensure_order_lines","lines","report","init")):
                  s=ast.get_source_segment(source,node)
                  if node.name=="init":
                      continue
                  print("NOVA_ICT_FUNC",node.name, s[:20000])
          PY
