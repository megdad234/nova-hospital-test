name: NOVA Batch 05 - Fast Source Validation
on:
  push:
    paths:
      - '.github/workflows/nova_batch05_fast.yml'
      - '.github/ci/nova_batch05_cashier_pharmacy.py'
      - '.github/ci/nova_batch05_ui.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NOVA_Hospital_GitHub_Ready_Source.zip -d .
      - name: Apply NOVA patches
        run: |
          python .github/ci/nova_batch01_patch.py
          python .github/ci/nova_batch02_patch.py
          python .github/ci/nova_batch03_patch.py
          python .github/ci/nova_batch04_lab_reception.py
          python .github/ci/nova_batch05_cashier_pharmacy.py
          python .github/ci/nova_batch05_ui.py
          python -m compileall -q pharmacy hospital
      - name: Display laboratory printer context
        run: sed -n '82,98p' hospital/static/app.js
      - name: JavaScript grammar checks on all changed screens
        run: |
          node --check pharmacy/static/app.js
          node --check hospital/static/app.js
          node --check hospital/static/finance-ui.js
      - name: Check synthetic cashier queue and held-cart operations
        run: |
          PYTHONPATH=pharmacy:. python - <<'PY'
          import tempfile,uuid
          from pathlib import Path
          import app
          old_db,old_data=app.DB,app.DATA
          with tempfile.TemporaryDirectory() as temp:
              app.DATA=Path(temp);app.DB=app.DATA/'audit.sqlite3'
              try:
                  app.init_db();c=app.db_connect()
                  app.bootstrap(c,{'username':'owner','full_name':'Synthetic Owner','password':'TestPassword123456'})
                  uid=app.one(c,'SELECT id FROM users')['id']
                  product=app.create_product(c,{'sku':'SYN-'+uuid.uuid4().hex[:9],'name':'Synthetic Medicine','packages':[{'unit_name':'unit','factor':1,'barcode':'syn'+uuid.uuid4().hex[:9],'sale_price':1,'is_default':1}]},uid)
                  pack=app.one(c,'SELECT id FROM packages WHERE product_id=?',(product['id'],))['id']
                  save=app.nova_hold_save(c,{'items':[{'package_id':pack,'qty':2}]},uid)
                  assert len(app.nova_held_list(c,uid))==1
                  assert app.one(c,'SELECT COUNT(*) n FROM sales')['n']==0
                  assert app.nova_pharmacy_tasks(c,uid)['held_carts']==1
                  app.nova_hold_delete(c,{'held_id':save['held_id']},uid)
                  assert app.nova_pharmacy_tasks(c,uid)['held_carts']==0
                  c.close()
                  print('NOVA05_SYNTHETIC_PHARMACY_HOLD_TASKS_PASS')
              finally:app.DB,app.DATA=old_db,old_data
          PY
      - name: Show UI anchors and cashier schema for independent review
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ('pharmacy/static/app.js','pharmacy/static/ux_v14.js','hospital/static/finance-ui.js','hospital/finance.py'):
              lines=Path(path).read_text(encoding='utf-8').splitlines()
              print('===',path,len(lines))
              if path=='pharmacy/static/app.js':
                  matches=['function nav','function redraw','function pos','function render','function dashboard','function draw','function sale','const pages','const state','function load']
              elif path=='pharmacy/static/ux_v14.js':
                  matches=['function nav','function redraw','function pos','function render','function dashboard','const old','const']
              elif path=='hospital/static/finance-ui.js':
                  matches=['function financeCashierView','function financeOpenInvoice','function financeInvoiceForm','function wireFinanceCashier','function financePrintInvoice']
              else:matches=['def upsert_service','def init(','def cashier_queue','def create_invoice','def quote']
              for i,line in enumerate(lines,1):
                  if any(x in line for x in matches):
                      print(str(i)+':',line[:800])
          PY
