name: Commercial installed server acceptance
on:
  workflow_dispatch:
  push:
    branches: [commercial-pharmacy-extraction-2026-11-04]
    paths:
      - '.github/workflows/commercial_installed_server_acceptance.yml'
jobs:
  installed-server:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NOVA-Commercial-Setup-UNVERIFIED-NOT-FOR-PRODUCTION
          run-id: 41985566751
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: installer
      - name: Check commercial service adapter syntax and unit contracts
        shell: pwsh
        run: |
          python -m py_compile commercial_pharmacy/windows_service.py
          if ($LASTEXITCODE -ne 0) { throw 'Commercial Windows service adapter syntax failed' }
          python -m unittest discover -s commercial_pharmacy -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Commercial pharmacy tests failed' }
      - name: Install and launch actual packaged server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem installer -Filter '*.exe' | Select-Object -First 1
          if (!$setup) { throw 'Installer not found' }
          $dest = Join-Path $env:RUNNER_TEMP 'CommercialAcceptance'
          $p = Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/NORESTART',"/DIR=$dest") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Installer failed' }
          $python = Join-Path $dest 'runtime/python.exe'
          & $python -m commercial_pharmacy.live_server_smoke --source-root $dest --data-dir (Join-Path $env:RUNNER_TEMP 'CommercialAcceptanceData') --port 18764 --timeout 35 --output installed_live_smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed server failed HTTP check' }
          $result = Get-Content installed_live_smoke.json -Raw | ConvertFrom-Json
          if (!$result.database_verified) { throw 'Installed independent database failed check' }
          if (!$result.http_responded) { throw 'Installed HTTP server did not respond' }
          if ($result.database_table_count -lt 1) { throw 'Installed database schema is empty' }
          $db = Join-Path $env:RUNNER_TEMP 'CommercialAcceptanceData/commercial_pharmacy.sqlite3'
          if (!(Test-Path $db)) { throw 'Dedicated commercial SQLite file missing' }
          $uninstaller = Get-ChildItem $dest -Filter 'unins*.exe' | Select-Object -First 1
          if (!$uninstaller) { throw 'Installed uninstaller not found' }
          $uninstall = Start-Process $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw 'Installed program uninstall failed' }
          if (Test-Path (Join-Path $dest 'pharmacy/app.py')) { throw 'Uninstall did not remove installed application' }
          if (!(Test-Path $db)) { throw 'Uninstall erased commercial pharmacy user database' }
          Write-Host 'INSTALLED_HTTP_DB_AND_UNINSTALL_DATA_PRESERVATION_PASSED'
          $before = (Get-FileHash $db -Algorithm SHA256).Hash
          $again = Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dest") -PassThru -Wait
          if ($again.ExitCode -ne 0) { throw 'Reinstallation failed' }
          if (!(Test-Path (Join-Path $dest 'runtime/python.exe'))) { throw 'Reinstallation runtime missing' }
          $after = (Get-FileHash $db -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'Reinstallation changed commercial pharmacy data' }
          & (Join-Path $dest 'runtime/python.exe') -m commercial_pharmacy.live_server_smoke --source-root $dest --data-dir (Join-Path $env:RUNNER_TEMP 'CommercialAcceptanceData') --port 18765 --timeout 35
          if ($LASTEXITCODE -ne 0) { throw 'Reinstalled server cannot reopen existing database' }
          Write-Host 'COMMERCIAL_REINSTALLATION_DATA_PRESERVATION_AND_RESTART_PASSED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Commercial-Installed-Server-Smoke
          path: installed_live_smoke.json
          if-no-files-found: warn
