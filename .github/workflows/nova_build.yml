  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-windows-build
  cancel-in-progress: true
jobs:
  build-install-and-test:
    runs-on: windows-2025
    timeout-minutes: 85
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Check out NOVA testing repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract complete NOVA source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:GITHUB_WORKSPACE 'NOVA_Hospital_GitHub_Ready_Source.zip'
          if(!(Test-Path -LiteralPath $zip)){throw 'NOVA source ZIP not uploaded to repository root'}
          Expand-Archive -LiteralPath $zip -DestinationPath $env:GITHUB_WORKSPACE -Force
          if(!(Test-Path 'windows/build-windows.ps1')){throw 'Windows build script missing'}
          if(!(Test-Path 'windows/ci-acceptance.ps1')){throw 'Windows acceptance script missing'}
          Write-Host 'NOVA_SOURCE_EXTRACTED'
      - name: Inspect original NOVA POS source before financial modifications
        shell: pwsh
        run: python .github/ci/nova_pos_source_audit.py
      - name: Set up Python on temporary Windows build runner only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only XLSX dependency on Windows runner
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4'
          if ($LASTEXITCODE -ne 0) { throw 'openpyxl test dependency installation failed' }
      - name: Verify NOVA price-list import, matching, approval and rollback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tests = @('preview','matching','candidates','approval','import','actual_cost')
          foreach ($test in $tests) {
            python ".github/ci/test_nova_price_list_$test.py"
            if ($LASTEXITCODE -ne 0) { throw "NOVA price-list $test tests failed" }
          }
      - name: Install Inno Setup on temporary Windows build runner only
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Close synthetic SQLite test connections properly on Windows
        shell: pwsh
        run: |
          python .github/ci/windows_sqlite_test_cleanup.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows test fixture lifecycle fix failed' }
      - name: Fix SHA256 verification in bundled Windows updater and rollback scripts
        shell: pwsh
        run: |
          python .github/ci/patch_upgrade_hash.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA update integrity patch failed' }
      - name: Apply reviewed NOVA Batch 01 source fixes
        shell: pwsh
        run: |
          python .github/ci/nova_batch01_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA Batch 01 source patch failed; installer not built' }
      - name: Apply NOVA Batch 02 pharmacy purchase fixes
        shell: pwsh
        run: |
          python .github/ci/nova_batch02_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA Batch 02 source patch failed; installer not built' }
      - name: Apply NOVA Batch 03 identity and regression checks
        shell: pwsh
        run: |
          python .github/ci/nova_batch03_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA Batch 03 source patch failed; installer not built' }
      - name: Apply NOVA Batch 04 laboratory and reception workflow upgrades
        shell: pwsh
        run: |
          python .github/ci/nova_batch04_lab_reception.py
      - name: Seed Al Sharq lab prices on fresh catalogues only
        shell: pwsh
        run: |
          python .github/ci/nova_alsharq_lab_seed.py
          python -m py_compile hospital/lab.py hospital/lab_catalog.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA Batch 04 source upgrade rejected; installer blocked' }
      - name: Apply NOVA Batch 05 pharmacy and cashier updates
        shell: pwsh
        run: |
          python .github/ci/nova_batch05_cashier_pharmacy.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA Batch 05 patch rejected; installer blocked' }
      - name: Apply NOVA Batch 05 Premium pharmacist and cashier screens
        shell: pwsh
        run: |
          python .github/ci/nova_batch05_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA Batch 05 UI not safe for installer' }
      - name: Enforce explicit free-service approval at cashier settlement
        shell: pwsh
        run: |
          python .github/ci/nova_batch05_free_policy.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA Batch 05 zero-price guard failed' }
      - name: Update cashier regression assertions to approved current roles
        shell: pwsh
        run: |
          python .github/ci/nova_batch05_test_expectations.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA Batch 05 acceptance contract inconsistent' }
      - name: Apply NOVA Batch 06 beneficiary insurance upgrades
        shell: pwsh
        run: |
          python .github/ci/nova_batch06_insurance.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA Batch 06 insurance source patch failed; installer blocked' }
      - name: Add mandatory bank reference indicator and warnings
        shell: pwsh
        run: |
          python .github/ci/nova_batch07_reference_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Bank reference UI patch failed; installer blocked' }
      - name: Apply NOVA Batch08 pharmacy workflow recovery and reports
        shell: pwsh
        run: |
          python .github/ci/nova_batch08_pharmacy_recovery.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA Batch08 pharmacy source patch failed; installer blocked' }
      - name: Apply NOVA Batch09 POS and admin collections
        shell: pwsh
        run: |
          python .github/ci/nova_batch09_pos_admin.py
          if ($LASTEXITCODE -ne 0) { throw 'Batch09 failed; installer blocked' }
          node --check pharmacy/static/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Batch09 held invoice POS script invalid; installer blocked' }
          node --check hospital/static/admin-ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Batch09 admin collections JavaScript syntax invalid; installer blocked' }
      - name: Unify thermal cashier receipts with pharmacy style
        shell: pwsh
        run: |
          python .github/ci/nova_batch10_receipt_print.py
          if ($LASTEXITCODE -ne 0) { throw 'Batch10 thermal printing source patch failed; installer blocked' }
      - name: Apply NOVA Batch11 unified receipt print engine
        shell: pwsh
        run: |
          python .github/ci/nova_batch11_unified_print.py
          if ($LASTEXITCODE -ne 0) { throw 'Batch11 unified thermal print patch failed' }
          node --check pharmacy/static/nova_pharmacy_batch08.js
          node .github/ci/nova_batch13_ui_smoke.js
          node --check hospital/static/finance-ui.js
          node .github/ci/nova_unified_print_test.js
          if ($LASTEXITCODE -ne 0) { throw 'Batch11 unified print test failed' }
          python -m unittest -q pharmacy.tests.test_nova_batch11
          if ($LASTEXITCODE -ne 0) { throw 'Batch11 receipt acceptance failed' }
      - name: Apply NOVA Batch12 pharmacy insurance patient linking
        shell: pwsh
        run: |
          python .github/ci/nova_batch12_insurance.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA12 insurance patch failed; installer blocked' }
          python -m compileall -q pharmacy hospital
          node --check pharmacy/static/nova_pharmacy_batch08.js
          if ($LASTEXITCODE -ne 0) { throw 'NOVA12 combined POS and insurance JS syntax invalid; installer blocked' }
          node --check pharmacy/static/app.js
          if ($LASTEXITCODE -ne 0) { throw 'NOVA12 pharmacy app JS syntax invalid; installer blocked' }
          $env:PYTHONPATH = 'pharmacy;.'
          python -m unittest -q pharmacy.tests.test_nova_batch12
          if ($LASTEXITCODE -ne 0) { throw 'NOVA12 insurance tests failed; installer blocked' }
      - name: Apply approved NOVA Batch13 split purchasing and pricing
        shell: pwsh
        run: |
          python .github/ci/nova_batch13_purchase.py
          python .github/ci/nova_inventory_dashboard.py
          node --check pharmacy/static/ux_v14.js
          if ($LASTEXITCODE -ne 0) { throw 'NOVA13 patch failed; installer blocked' }
          node --check pharmacy/static/nova_pharmacy_batch08.js
          if ($LASTEXITCODE -ne 0) { throw 'NOVA13 JS syntax invalid; installer blocked' }
          $env:PYTHONPATH = 'pharmacy;.'
          python -m unittest -q pharmacy.tests.test_nova_batch13 pharmacy.tests.test_nova_batch08
          if ($LASTEXITCODE -ne 0) { throw 'NOVA13 purchase regression failed; installer blocked' }
      - name: Apply NOVA Batch14 atomic sales discount
        shell: pwsh
        run: |
          python .github/ci/nova_batch14_pos_discount.py
          python .github/ci/nova_batch14_finance_tests.py
          python .github/ci/nova_price_integration_audit.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA14 discount patch failed; installer blocked' }
          python -m compileall -q pharmacy
          node --check pharmacy/static/app.js
          if ($LASTEXITCODE -ne 0) { throw 'NOVA14 POS syntax invalid; installer blocked' }
      - name: Audit actual pharmacy price schema and integration anchors
        shell: pwsh
        run: |
          python .github/ci/nova_batch15_integration_audit.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA price integration audit failed' }
      - name: Integrate guarded bulk supplier price API
        shell: pwsh
        run: |
          python .github/ci/nova_batch15_bulk_prices.py
          if ($LASTEXITCODE -ne 0) { throw 'Bulk price integration failed' }
          python -m compileall -q pharmacy
          if ($LASTEXITCODE -ne 0) { throw 'Bulk price integration syntax failed' }
          node --check pharmacy/static/nova_bulk_prices_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Bulk price UI syntax failed' }
          node --check pharmacy/static/nova_manual_price_editor.js
          if ($LASTEXITCODE -ne 0) { throw 'Manual price editor syntax failed' }
          python .github/ci/test_nova_bulk_price_integration.py
          if ($LASTEXITCODE -ne 0) { throw 'Bulk price integration regression failed' }
          python .github/ci/test_nova_manual_price.py
          if ($LASTEXITCODE -ne 0) { throw 'Manual medicine price regression failed' }
      - name: Apply presentation-only refund history status
        shell: pwsh
        run: |
          python -m py_compile .github/ci/nova_batch16_return_status.py
          if ($LASTEXITCODE -ne 0) { throw 'Refund patch Python syntax invalid' }
          python .github/ci/nova_batch16_return_status.py
          if ($LASTEXITCODE -ne 0) { throw 'Refund history display patch failed' }
          node --check pharmacy/static/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Refund history syntax invalid' }
      - name: Validate isolated admin collections preview JavaScript
        shell: pwsh
        run: |
          node --check hospital/static/nova_batch09_collections.js
          if ($LASTEXITCODE -ne 0) { throw 'Admin collections preview JavaScript syntax invalid; installer blocked' }
      - name: Install isolated admin refund screen and validate JavaScript
        shell: pwsh
        run: |
          python .github/ci/nova_admin_refunds.py
          node --check hospital/static/app.js
          node --check hospital/static/admin-ui.js
          if ($LASTEXITCODE -ne 0) { throw 'NOVA admin refund UI syntax invalid' }
      - name: Apply safe partial and repeated refund ledger migration
        shell: pwsh
        run: |
          python .github/ci/nova_partial_refunds.py
          python -m py_compile hospital/finance.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA refund backend invalid' }
          $env:PYTHONPATH = 'pharmacy;.'
          python .github/ci/test_nova_partial_refunds.py
          if ($LASTEXITCODE -ne 0) { throw 'NOVA refund synthetic regression failed' }
          node --check hospital/static/admin-ui.js
          if ($LASTEXITCODE -ne 0) { throw 'NOVA refund admin UI invalid' }
      - name: Apply isolated Royal Lab print notice correction only
        shell: pwsh
        run: |
          python .github/ci/royallab_order_route_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab order API patch rejected; installer blocked' }
          python .github/ci/royallab_native_autoseed_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab native automatic catalogue initialization failed' }
          python -m unittest discover -s tests -p 'test_royallab_native_autoseed_patch.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab native autoseed patch tests failed' }
          python -m py_compile hospital/royallab_existing_catalog_replacement.py hospital/royallab_existing_line_overlay.py
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab original NOVA table integration syntax invalid' }
          python .github/ci/royallab_existing_catalog_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab existing NOVA catalogue patch failed' }
          python -m unittest discover -s tests -p 'test_royallab_existing_catalog_patch.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab direct catalogue patch regression failed' }
          python .github/ci/royallab_native_gateway_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab native gateway patch failed' }
          python -m unittest discover -s tests -p 'test_royallab_native_gateway_patch.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab native gateway regression failed' }
          python -m py_compile hospital/gateway.py hospital/royallab_nova_live_order_overlay.py hospital/royallab_nova_binding_loader.py hospital/royallab_nova_binding_schema.py hospital/royallab_nova_order_detail_gate.py hospital/royallab_nova_order_detail_types.py hospital/royallab_nova_typed_form_contract.py hospital/royallab_nova_order_line_resolver.py hospital/royallab_nova_parameter_plan.py hospital/royallab_catalog_preview.py hospital/royallab_field_adapter.py
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab order API invalid; installer blocked' }
          python -m unittest discover -s tests -p 'test_royallab_order_route_patch.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab order API regression failed; installer blocked' }
          python -m unittest discover -s tests -p 'test_royallab_nova_parameter_plan.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab inactive parameter import regression failed; installer blocked' }
          python -m unittest discover -s tests -p 'test_royallab_nova_typed_form_contract.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab source typed contract regression failed; installer blocked' }
          python -m unittest discover -s tests -p 'test_royallab_source_bool.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab source boolean regression failed; installer blocked' }
          python -m unittest discover -s tests -p 'test_royallab_source_bundle_preflight.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab source integrity preflight tests failed' }
          python -m unittest discover -s tests -p 'test_royallab_native_catalog_api.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab native catalog API regression failed' }
          python -m unittest discover -s tests -p 'test_royallab_native_catalog_store.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab native SQLite catalogue regression failed' }
          python -m unittest discover -s tests -p 'test_royallab_native_result_form.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab native forms contract failed' }
          python -m unittest discover -s tests -p 'test_royallab_nova_test_match_plan.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab exact test mapping regression failed' }
          python -m unittest discover -s tests -p 'test_royallab_visibility_diagnosis.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab visibility diagnosis regression failed; installer blocked' }
          python -m unittest discover -s tests -p 'test_royallab_clinical_binding_integration.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab clinical binding integration failed; installer blocked' }
          python .github/ci/royallab_lab_print_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab JS print patch rejected; installer blocked' }
          python .github/ci/royallab_typed_input_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab typed UI patch rejected; installer blocked' }
          python .github/ci/royallab_lab_a4_css_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab A4 CSS patch rejected; installer blocked' }
          node --check hospital/static/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab report JS invalid; installer blocked' }
          python -m unittest discover -s tests -p 'test_royallab_lab_print_patch.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab JS print regression failed; installer blocked' }
          python -m unittest discover -s tests -p 'test_royallab_typed_input_patch.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab typed UI regression failed; installer blocked' }
          python -m unittest discover -s tests -p 'test_royallab_lab_a4_css_patch.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab A4 CSS regression failed; installer blocked' }
      - name: Bundle pinned Royal Lab original catalog into Windows source
        shell: pwsh
        env:
          ROYALLAB_SOURCE_TOKEN: ${{ secrets.ROYALLAB_SOURCE_TOKEN }}
        run: |
          python .github/ci/royallab_bundle_source.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab original catalog unavailable or source integrity failed' }
          python .github/ci/royallab_actual_nova_schema_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Real NOVA lab schema incompatible with Royal Lab replacement' }
          python .github/ci/royallab_native_bundle_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab real source native SQLite import failed' }
      - name: Verify Royal Lab native result draft persistence
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_royallab_native_result_drafts.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab native draft persistence regression failed' }
          python -m unittest discover -s tests -p 'test_royallab_real_catalog_order_roundtrip.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Real laboratory source 271-test paid-order save/reopen regression failed' }
          python -m unittest discover -s tests -p 'test_royallab_native_form_html.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab form rendering tests failed' }
          node --check hospital/static/royallab-native-picker.js
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab native picker syntax invalid' }
          python -m unittest discover -s tests -p 'test_royallab_replacement_readiness.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab replacement readiness tests failed' }
          python -m unittest discover -s tests -p 'test_royallab_native_order_bridge.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab native order bridge regression failed' }
          python -m unittest discover -s tests -p 'test_royallab_existing_schema_audit.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Existing NOVA lab schema audit regression failed' }
          python -m unittest discover -s tests -p 'test_royallab_existing_catalog_replacement.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Direct Royal Lab catalogue replacement regression failed' }
          python -m unittest discover -s tests -p 'test_royallab_existing_line_overlay.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Original NOVA result line overlay regression failed' }
      - name: Verify Royal Lab final-release gate contract (development installer remains unapproved)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_royallab_release_gate.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Royal Lab release evidence gate regression failed' }
          Write-Host 'Development installer may be built and tested without falsely claiming real installed clinical validation.'
          Write-Host 'Final Royal Lab release remains blocked until installed-Windows runtime evidence is available.'
      - name: Include Royal Lab catalogue JSON inside frozen Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $library = 'hospital/royallab_source/nova_lab_library.json'
          if (!(Test-Path $library)) { throw 'Royal Lab catalogue missing before packaging' }
          $script = 'windows/build-windows.ps1'
          $source = Get-Content -LiteralPath $script -Raw
          $extra = '--add-data "hospital/royallab_source/nova_lab_library.json;hospital/royallab_source"'
          # Target the server build command, not comments or installer references.
          $lines = $source -split "`r?`n"
          $targets = @(for ($n=0; $n -lt $lines.Count; $n++) {
            if ($lines[$n] -match '(?i)pyinstaller' -and $lines[$n] -match '(?i)nova_server|nova-server|NOVA-Hospital-Server') { $n }
          })
          if ($targets.Count -ne 1) { throw "Cannot uniquely identify server PyInstaller command: $($targets.Count) matches" }
          $n = $targets[0]
          $lines[$n] = $lines[$n] -replace '(?i)(pyinstaller(?:\\.exe)?)', ('$1 ' + $extra)
          $source = $lines -join "`r`n"
          Set-Content -LiteralPath $script -Value $source -Encoding utf8
          Write-Host 'ROYALLAB_PYINSTALLER_DATA_INCLUDED'
      - name: Build Windows installer freshly from fully patched source (no cached executable)
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath windows/output/NOVA-Hospital-Setup-DEV.exe) { Remove-Item -LiteralPath windows/output/NOVA-Hospital-Setup-DEV.exe -Force }
          # Legacy integration fixtures explicitly require the original CBC seed.
          # This process-only flag does not change packaged runtime behavior.
          $env:NOVA_LEGACY_LAB_REGRESSION='1'
          try { ./windows/build-windows.ps1 }
          finally { Remove-Item Env:NOVA_LEGACY_LAB_REGRESSION -ErrorAction SilentlyContinue }
          if ($LASTEXITCODE -ne 0) { throw 'Fresh Windows installer build failed' }
      - name: Verify installer exists before acceptance
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath windows/output/NOVA-Hospital-Setup-DEV.exe -PathType Leaf)) { throw 'No Windows installer for acceptance' }
      # Publish the built candidate before potentially slow Windows service/update tests.
      # This artifact is explicitly unapproved; production release remains gated.
      - name: Publish development installer artifact immediately after build
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Hospital-Windows-Setup-DEV-UNAPPROVED
          path: windows/output/NOVA-Hospital-Setup-DEV.exe
          retention-days: 7
          if-no-files-found: error
      - name: Install, upgrade, and test rollback on synthetic records
        shell: pwsh
        timeout-minutes: 18
        run: |
          # The server may fail early and leave the installer waiting on a modal
          # dialog. Surface its logs immediately rather than waiting 18 minutes.
          $ErrorActionPreference='Stop'
          $job = Start-Job -ScriptBlock {
            Set-Location $using:PWD
            & ./windows/ci-acceptance.ps1
            if ($LASTEXITCODE -ne 0) { throw "Acceptance exited with $LASTEXITCODE" }
          }
          $logRoot=Join-Path $env:ProgramData 'NOVA_Hospital\logs'
          try {
            $deadline=(Get-Date).AddMinutes(15)
            while ($job.State -eq 'Running' -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 10
              $stderr=Join-Path $logRoot 'stderr.log'
              if (Test-Path $stderr) {
                $tail=(Get-Content $stderr -Tail 30 -ErrorAction SilentlyContinue) -join "`n"
                if ($tail -match 'Existing NOVA central database failed verification|Royal Lab source missing; refusing old NOVA catalogue') {
                  throw "NOVA server failed startup during installer acceptance. STDERR: $tail"
                }
              }
            }
            if ($job.State -eq 'Running') { throw 'NOVA installer acceptance exceeded 15-minute watchdog' }
            Receive-Job $job -ErrorAction Stop
            if ($job.State -ne 'Completed') { throw "NOVA acceptance job state: $($job.State)" }
          }
          finally {
            if ($job.State -eq 'Running') { Stop-Job $job }
            Remove-Job $job -Force -ErrorAction SilentlyContinue
          }
      - name: Print synthetic Windows installer diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $root=Join-Path $env:ProgramData 'NOVA_Hospital'
          foreach ($name in @('update-preflight.log','update-rollback.log','stdout.log','stderr.log')) {
            $path=Join-Path $root ('logs\\'+$name)
            Write-Host ('---- '+$path+' ----')
            if (Test-Path -LiteralPath $path) { Get-Content -LiteralPath $path -Tail 80 } else { Write-Host 'NOT_FOUND' }
          }
          Get-Service -Name NOVA_Hospital_Server -ErrorAction SilentlyContinue | Format-List Status,Name,DisplayName

