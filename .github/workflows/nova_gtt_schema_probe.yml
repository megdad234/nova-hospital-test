name: NOVA GTT original lab source schema probe
on:
  push:
    branches: [feature/royallab-full-migration-20261111]
    paths: ['.github/workflows/nova_gtt_schema_probe.yml']
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read original lab schema and result workflow (no patient data)
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, zipfile
          with zipfile.ZipFile('NOVA_Hospital_GitHub_Ready_Source.zip') as z:
              names=[x for x in z.namelist() if x.endswith('hospital/lab.py')]
              assert len(names)==1,names
              source=z.read(names[0]).decode('utf8')
          tree=ast.parse(source)
          for stmt in tree.body:
              if isinstance(stmt,ast.Assign):
                  for t in stmt.targets:
                      if isinstance(t,ast.Name) and t.id=='SCHEMA':
                          print("GTT_ORIGINAL_SCHEMA=",str(ast.literal_eval(stmt.value))[:24000])
              if isinstance(stmt,ast.FunctionDef) and stmt.name in ('init','create_order','order_detail','save_values','ensure_order_lines','lines','item_lines','test_form','submit_order','result_summary'):
                  print('GTT_FUNCTION',stmt.name,ast.get_source_segment(source,stmt)[:22000])
          PY
